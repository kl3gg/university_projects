<!DOCTYPE HTML>

<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terningkast Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1> Terningskast Simulator </h1>
        <div class="controls">
            <div class="input-group">
                <label for="antallT">Antall Terninger</label>
                <input type="number" id="antallT" value="2" min="1" max="100">
            </div>
            <div class="input-group">
                <label for="antallS">Antall sider per terning:</label>
                <input type="number" id="antallS" value="6" min="2" max="100">
            </div>
            <button id="Kast">Kast terning(ene)</button>
        </div>
        <div id="feilmelding" class="error"></div>

        <div class="resultatBox">
            <h2>Resultat:</h2>
            <div id="terningCon" class="dice-grid"></div>
            <p id="sumTotal" class="sum"></p>

        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
